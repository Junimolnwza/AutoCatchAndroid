name: Build Mod
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Extract zip
        run: unzip AutoCatch_GitHub.zip
      - name: Build
        run: dotnet build AutoCatch.csproj -c Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCatch-mod
          path: |
            bin/Release/net6.0/AutoCatch.dll
            AutoCatch/manifest.json
